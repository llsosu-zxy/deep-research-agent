[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-agent research copilot with LangGraph, hybrid RAG, guardrails and an eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
  "rank-bm25>=0.2.2",
  "langgraph>=0.2.40",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "gradio>=5.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
gpu = ["sentence-transformers>=3.0", "peft>=0.11", "accelerate>=0.33", "datasets>=2.20"]

[tool.setuptools.packages.find]
include = ["agents*", "core*", "app*", "ui*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
